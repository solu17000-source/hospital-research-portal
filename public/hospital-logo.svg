<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bae6fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7dd3fc;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer star / arabesque shape - 5 petals -->
  <g transform="translate(100,95)">
    <!-- Petal 1 - top -->
    <path d="M0,-60 C15,-45 20,-20 0,-8 C-20,-20 -15,-45 0,-60Z" fill="url(#starGrad)" opacity="0.9"/>
    <!-- Petal 2 - top-right -->
    <path d="M57,-18 C42,-8 20,5 8,-8 C14,-28 35,-38 57,-18Z" fill="url(#starGrad)" opacity="0.9"/>
    <!-- Petal 3 - bottom-right -->
    <path d="M35,48 C22,35 18,12 30,4 C44,8 50,28 35,48Z" fill="url(#starGrad)" opacity="0.9"/>
    <!-- Petal 4 - bottom-left -->
    <path d="M-35,48 C-50,28 -44,8 -30,4 C-18,12 -22,35 -35,48Z" fill="url(#starGrad)" opacity="0.9"/>
    <!-- Petal 5 - top-left -->
    <path d="M-57,-18 C-35,-38 -14,-28 -8,-8 C-20,5 -42,-8 -57,-18Z" fill="url(#starGrad)" opacity="0.9"/>

    <!-- Inner decorative rings on each petal -->
    <path d="M0,-52 C10,-42 14,-24 0,-14 C-14,-24 -10,-42 0,-52Z" fill="white" opacity="0.25"/>
    <path d="M50,-16 C38,-8 20,2 10,-6 C16,-22 32,-32 50,-16Z" fill="white" opacity="0.25"/>
    <path d="M30,44 C18,32 16,14 26,6 C38,12 44,28 30,44Z" fill="white" opacity="0.25"/>
    <path d="M-30,44 C-44,28 -38,12 -26,6 C-16,14 -18,32 -30,44Z" fill="white" opacity="0.25"/>
    <path d="M-50,-16 C-32,-32 -16,-22 -10,-6 C-20,2 -38,-8 -50,-16Z" fill="white" opacity="0.25"/>

    <!-- Center circle -->
    <circle cx="0" cy="0" r="22" fill="url(#innerGrad)" opacity="0.95"/>
    <circle cx="0" cy="0" r="18" fill="white" opacity="0.5"/>

    <!-- Saudi Arabia map silhouette (simplified) -->
    <path d="M-8,-10 L-6,-14 L-2,-16 L4,-13 L8,-8 L10,-2 L8,6 L4,12 L0,14 L-4,10 L-6,4 L-8,-2 Z"
      fill="url(#starGrad)" opacity="0.8"/>
    <!-- Small green dot for Jazan -->
    <circle cx="0" cy="8" r="2" fill="#16a34a" opacity="0.9"/>

    <!-- Decorative small circles at petal tips -->
    <circle cx="0" cy="-57" r="3.5" fill="url(#starGrad)" opacity="0.6"/>
    <circle cx="54" cy="-17" r="3.5" fill="url(#starGrad)" opacity="0.6"/>
    <circle cx="33" cy="46" r="3.5" fill="url(#starGrad)" opacity="0.6"/>
    <circle cx="-33" cy="46" r="3.5" fill="url(#starGrad)" opacity="0.6"/>
    <circle cx="-54" cy="-17" r="3.5" fill="url(#starGrad)" opacity="0.6"/>

    <!-- Connecting arcs between petals -->
    <path d="M8,-55 Q35,-35 52,-15" stroke="url(#starGrad)" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M52,-14 Q55,20 32,44" stroke="url(#starGrad)" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M30,44 Q0,60 -30,44" stroke="url(#starGrad)" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M-32,44 Q-55,20 -52,-14" stroke="url(#starGrad)" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M-52,-15 Q-35,-35 -8,-55" stroke="url(#starGrad)" stroke-width="1.5" fill="none" opacity="0.5"/>
  </g>

  <!-- Arabic text: مستشفى الأمير محمد بن ناصر -->
  <text x="100" y="168" text-anchor="middle" font-family="Arial, sans-serif"
    font-size="11" font-weight="700" fill="#0284c7" letter-spacing="0.5">
    مستشفى الأمير محمد بن ناصر
  </text>

  <!-- English text -->
  <text x="100" y="183" text-anchor="middle" font-family="Arial, sans-serif"
    font-size="9" font-weight="600" fill="#0ea5e9" letter-spacing="0.3">
    Prince Mohammed Bin Nasser Hospital
  </text>

  <!-- Sub text -->
  <text x="100" y="196" text-anchor="middle" font-family="Arial, sans-serif"
    font-size="8" fill="#38bdf8" letter-spacing="0.5">
    تجمع جازان الصحي
  </text>
</svg>
