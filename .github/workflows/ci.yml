name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an older run of the same workflow on the same branch when a new
# push arrives — saves CI minutes on rapid iteration.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'

jobs:
  verify:
    name: Type-check, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint --max-warnings 0

      - name: Build
        env:
          # Demo mode so the build doesn't fail looking for a Supabase project.
          # Production builds set these in the deployment env, not in CI.
          NEXT_PUBLIC_DEMO_MODE: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Upload build summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.run_number }}
          path: |
            .next/build-manifest.json
            .next/required-server-files.json
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    needs: verify
    # Only run for pushes to main — PRs don't need the docker check unless
    # they touch the Dockerfile.
    if: github.event_name == 'push' || contains(github.event.pull_request.changed_files, 'Dockerfile')
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: pmnh-research-portal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_DEMO_MODE=true

      - name: Smoke-test container
        run: |
          docker run -d --rm --name portal-ci -p 3000:3000 pmnh-research-portal:ci
          # Give it a moment to come up.
          for i in {1..15}; do
            if curl -sf http://localhost:3000/ >/dev/null; then
              echo "Container responded on attempt $i"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:3000/ >/dev/null
          docker stop portal-ci
